[pytest]
# QtWebEngine-backed Lite Designer suites are heavy: the nine files in this
# group need ~157 s and peak at ~4 GB RSS in one process, and QtWebEngine
# tears down uncleanly after them (segfault at exit). They stay in the
# repository, but out of the default run so Designer/unit suites are cheap.
#
#   pytest                       # default: skips the webengine group
#   pytest -m webengine          # explicitly run the heavy group
#   pytest tests/test_x.py       # -m from the command line wins
markers =
    webengine: heavy QtWebEngine Lite Designer suite (excluded by default)
addopts = -m "not webengine"
