<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RhemaCast live sermon verse display overlay for OBS">
    <title>RhemaCast Display</title>
    <link rel="stylesheet" href="themes.css">
    <!-- Google Fonts: Cormorant Garamond (premium serif) + DM Sans (clean geometric sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="container" class="hidden" aria-live="polite" aria-atomic="true" role="status">
        <div id="verse-content">
            <h1 id="verse-text" aria-label="Verse text">In the beginning God created the heaven and the earth.</h1>
            <p id="verse-ref"><span id="verse-ref-text" aria-label="Verse reference">Genesis 1:1</span> <span id="verse-ref-translation" aria-label="Translation">KJV</span></p>
        </div>
    </div>
    <script src="display.js"></script>
</body>
</html>
